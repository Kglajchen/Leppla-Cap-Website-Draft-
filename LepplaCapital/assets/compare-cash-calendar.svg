<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="ccTitle ccDesc">
  <title id="ccTitle">Layered Cash Management</title>
  <desc id="ccDesc">Liquidity layers ordered by duration, from the house bank up through optional year two.</desc>
  <rect width="520" height="380" fill="#faf8f4"/>

  <!-- Shared frame: axis x=38, diagram x=80–510, y=52–328, center=295 -->
  <line x1="38" y1="48" x2="38" y2="328" stroke="#000000" stroke-width="1.5"/>
  <polygon points="38,40 34,50 42,50" fill="#000000"/>
  <text
    x="16"
    y="190"
    text-anchor="middle"
    transform="rotate(-90 16 190)"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.6"
    fill="#000000"
  >DURATION</text>
  <text x="50" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#000000">Longer</text>

  <text x="295" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#000000">READ FROM THE BOTTOM UP</text>

  <!-- Bars share pyramid envelope: center 295, base 80–510 -->
  <rect x="193" y="52" width="204" height="40" rx="3" fill="#1a4a7a"/>
  <text x="295" y="77" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">L4 · Two Year</text>

  <rect x="173" y="100" width="244" height="40" rx="3" fill="#0f355f"/>
  <text x="295" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">L3 · Next Year</text>

  <rect x="153" y="148" width="284" height="40" rx="3" fill="#08284a"/>
  <text x="295" y="173" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">L2 · Next Quarter</text>

  <rect x="133" y="196" width="324" height="40" rx="3" fill="#051c35"/>
  <text x="295" y="221" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">L1 · Next Month</text>

  <rect x="80" y="248" width="430" height="80" rx="4" fill="#b98421"/>
  <text x="295" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">L0 · Your Bank</text>

  <text x="295" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000">Liquidity flows downhill to your bank</text>
</svg>
