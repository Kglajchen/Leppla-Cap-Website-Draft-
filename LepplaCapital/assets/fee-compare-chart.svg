<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="feeTitle feeDesc">
  <title id="feeTitle">Fixed vs variable fee growth</title>
  <desc id="feeDesc">Line chart comparing ending account value over 10 years at a 1.25 percent variable fee versus a 50 basis point Leppla fee, both billed quarterly.</desc>
  <rect width="680" height="340" fill="#faf8f4"/>

  <!-- Grid: $0, $4M, $8M, $12M, $16M -->
  <g stroke="#e8ecf0" stroke-width="1">
    <line x1="56" y1="24" x2="576" y2="24"/>
    <line x1="56" y1="84" x2="576" y2="84"/>
    <line x1="56" y1="144" x2="576" y2="144"/>
    <line x1="56" y1="204" x2="576" y2="204"/>
    <line x1="56" y1="264" x2="576" y2="264"/>
  </g>

  <!-- Axes -->
  <line x1="56" y1="24" x2="56" y2="264" stroke="#08284a" stroke-width="1.5"/>
  <line x1="56" y1="264" x2="576" y2="264" stroke="#08284a" stroke-width="1.5"/>

  <!-- Y labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5c646c" text-anchor="end">
    <text x="48" y="268">$0</text>
    <text x="48" y="208">$4M</text>
    <text x="48" y="148">$8M</text>
    <text x="48" y="88">$12M</text>
    <text x="48" y="28">$16M</text>
  </g>

  <!-- X labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5c646c" text-anchor="middle">
    <text x="56" y="284">0</text>
    <text x="186" y="284">2.5</text>
    <text x="316" y="284">5</text>
    <text x="446" y="284">7.5</text>
    <text x="576" y="284">10 yrs</text>
  </g>

  <!-- Variable 1.25% line -->
  <polyline
    fill="none"
    stroke="#08284a"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
    points="56,189 108,181 160,172.2 212,162.4 264,151.6 316,139.6 368,126.4 420,111.7 472,95.5 524,77.6 576,57.8"
  />

  <!-- Leppla 50bp line -->
  <polyline
    fill="none"
    stroke="#b98421"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
    points="56,189 108,180.4 160,170.8 212,160.2 264,148.3 316,135 368,120.2 420,103.7 472,85.4 524,64.9 576,42.1"
  />

  <!-- End markers -->
  <circle cx="576" cy="57.8" r="4.5" fill="#08284a"/>
  <circle cx="576" cy="42.1" r="4.5" fill="#b98421"/>

  <!-- End values to the right of each dot -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">
    <text x="588" y="46.1" fill="#b98421">$14.8M</text>
    <text x="588" y="61.8" fill="#08284a">$13.7M</text>
  </g>

  <!-- Legend — side by side -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <line x1="56" y1="312" x2="84" y2="312" stroke="#b98421" stroke-width="3"/>
    <text x="92" y="316" fill="#08284a">Leppla Capital Fixed 50 Basis Point Fee</text>
    <line x1="360" y1="312" x2="388" y2="312" stroke="#08284a" stroke-width="3"/>
    <text x="396" y="316" fill="#08284a">Others Variable 125 Basis Point Fee</text>
  </g>
</svg>
