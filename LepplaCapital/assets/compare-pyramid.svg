<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="pyTitle pyDesc">
  <title id="pyTitle">Securities Investment Pyramid</title>
  <desc id="pyDesc">Eight securities layers ordered by risk tolerance: Foundational through Direct, read from the bottom up.</desc>
  <rect width="520" height="380" fill="#faf8f4"/>

  <!-- Shared frame: axis x=38, diagram x=80–510, y=52–328, center=295 -->
  <line x1="38" y1="48" x2="38" y2="328" stroke="#000000" stroke-width="1.5"/>
  <polygon points="38,40 34,50 42,50" fill="#000000"/>
  <text
    x="16"
    y="190"
    text-anchor="middle"
    transform="rotate(-90 16 190)"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.6"
    fill="#000000"
  >RISK TOLERANCE</text>
  <text x="50" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#000000">Higher</text>

  <text x="295" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#000000">READ FROM THE BOTTOM UP</text>

  <!--
    True triangle: apex (295, 52), base y=328 from x=80 to x=510
    halfW max = 215, height = 276, 8 bands of 34.5
    y = 52, 86.5, 121, 155.5, 190, 224.5, 259, 293.5, 328
  -->

  <polygon points="295,52 321.875,86.5 268.125,86.5" fill="#2a5f94"/>
  <text x="295" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Direct</text>

  <polygon points="268.125,86.5 321.875,86.5 348.75,121 241.25,121" fill="#1a4a7a"/>
  <text x="295" y="111" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Thematic</text>

  <polygon points="241.25,121 348.75,121 375.625,155.5 214.375,155.5" fill="#0f355f"/>
  <text x="295" y="146" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Sector</text>

  <polygon points="214.375,155.5 375.625,155.5 402.5,190 187.5,190" fill="#08284a"/>
  <text x="295" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Asset Class</text>

  <polygon points="187.5,190 402.5,190 429.375,224.5 160.625,224.5" fill="#051c35"/>
  <text x="295" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#ffffff">Alpha</text>

  <polygon points="160.625,224.5 429.375,224.5 456.25,259 133.75,259" fill="#d4b05a"/>
  <text x="295" y="249" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Market-Beta</text>

  <polygon points="133.75,259 456.25,259 483.125,293.5 106.875,293.5" fill="#c9a045"/>
  <text x="295" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fixed Income</text>

  <polygon points="106.875,293.5 483.125,293.5 510,328 80,328" fill="#b98421"/>
  <text x="295" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#ffffff">Foundational</text>

  <!-- Layer separators — same treatment across the full triangle -->
  <g stroke="#ffffff" stroke-width="1.25" stroke-linecap="square">
    <line x1="268.125" y1="86.5" x2="321.875" y2="86.5"/>
    <line x1="241.25" y1="121" x2="348.75" y2="121"/>
    <line x1="214.375" y1="155.5" x2="375.625" y2="155.5"/>
    <line x1="187.5" y1="190" x2="402.5" y2="190"/>
    <line x1="160.625" y1="224.5" x2="429.375" y2="224.5"/>
    <line x1="133.75" y1="259" x2="456.25" y2="259"/>
    <line x1="106.875" y1="293.5" x2="483.125" y2="293.5"/>
  </g>

  <text x="295" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000">Foundation first · broader layers with approval</text>
</svg>
