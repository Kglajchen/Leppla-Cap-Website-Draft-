<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="ccTitle ccDesc">
  <title id="ccTitle">Layered Cash Management</title>
  <desc id="ccDesc">Liquidity layers L1 through L4 ordered by duration. Liquidity flows downhill to your bank.</desc>
  <rect width="520" height="380" fill="#ffffff"/>

  <!-- Axis matches Pyramid vertical span: y=48 to y=328 -->
  <line x1="38" y1="48" x2="38" y2="328" stroke="#000000" stroke-width="1.5"/>
  <polygon points="38,40 34,50 42,50" fill="#000000"/>
  <text
    x="16"
    y="190"
    text-anchor="middle"
    transform="rotate(-90 16 190)"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.6"
    fill="#000000"
  >DURATION</text>
  <text x="50" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#000000">Longer</text>


  <!--
    Align to Pyramid content: top y=52 (Direct), bottom y=328 (Foundational)
    4 equal bands, height = 69
    y = 52, 121, 190, 259, 328
  -->

  <rect x="193" y="52" width="204" height="69" rx="3" fill="#1a4a7a"/>
  <text x="295" y="93" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">L4 · Two Year</text>

  <rect x="163" y="121" width="264" height="69" rx="3" fill="#0f355f"/>
  <text x="295" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">L3 · Next Year</text>

  <rect x="133" y="190" width="324" height="69" rx="3" fill="#08284a"/>
  <text x="295" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">L2 · Next Quarter</text>

  <rect x="103" y="259" width="384" height="69" rx="3" fill="#051c35"/>
  <text x="295" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">L1 · Next Month</text>

  <text x="295" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000">Liquidity flows downhill to your bank</text>
</svg>
