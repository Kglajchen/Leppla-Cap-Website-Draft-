<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="pyTitle pyDesc">
  <title id="pyTitle">Securities Investment Pyramid</title>
  <desc id="pyDesc">Eight securities layers ordered by risk tolerance: Foundational through Direct, read from the bottom up.</desc>
  <rect width="520" height="380" fill="#ffffff"/>

  <!-- Mirror of Cash graphic: axis on the right with matching margin -->
  <line x1="482" y1="48" x2="482" y2="328" stroke="#000000" stroke-width="1.5"/>
  <polygon points="482,40 476,50 488,50" fill="#000000"/>
  <text
    x="504"
    y="190"
    text-anchor="middle"
    transform="rotate(90 504 190)"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.6"
    fill="#000000"
  >RISK TOLERANCE</text>
  <text x="470" y="54" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#000000">Higher</text>


  <!--
    Center 225, base y=328 from x=10 to x=440 (mirrors Cash left-axis layout)
    halfW max = 215, height = 276, 8 bands of 34.5
  -->

  <polygon points="225,52 251.875,86.5 198.125,86.5" fill="#2a5f94"/>
  <text x="225" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Direct</text>

  <polygon points="198.125,86.5 251.875,86.5 278.75,121 171.25,121" fill="#1a4a7a"/>
  <text x="225" y="111" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Thematic</text>

  <polygon points="171.25,121 278.75,121 305.625,155.5 144.375,155.5" fill="#0f355f"/>
  <text x="225" y="146" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Sector</text>

  <polygon points="144.375,155.5 305.625,155.5 332.5,190 117.5,190" fill="#08284a"/>
  <text x="225" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Asset Class</text>

  <polygon points="117.5,190 332.5,190 359.375,224.5 90.625,224.5" fill="#051c35"/>
  <text x="225" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#ffffff">Alpha</text>

  <polygon points="90.625,224.5 359.375,224.5 386.25,259 63.75,259" fill="#d4b05a"/>
  <text x="225" y="249" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Market-Beta</text>

  <polygon points="63.75,259 386.25,259 413.125,293.5 36.875,293.5" fill="#c9a045"/>
  <text x="225" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fixed Income</text>

  <polygon points="36.875,293.5 413.125,293.5 440,328 10,328" fill="#b98421"/>
  <text x="225" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#ffffff">Foundational</text>

  <g stroke="#ffffff" stroke-width="1.25" stroke-linecap="square">
    <line x1="198.125" y1="86.5" x2="251.875" y2="86.5"/>
    <line x1="171.25" y1="121" x2="278.75" y2="121"/>
    <line x1="144.375" y1="155.5" x2="305.625" y2="155.5"/>
    <line x1="117.5" y1="190" x2="332.5" y2="190"/>
    <line x1="90.625" y1="224.5" x2="359.375" y2="224.5"/>
    <line x1="63.75" y1="259" x2="386.25" y2="259"/>
    <line x1="36.875" y1="293.5" x2="413.125" y2="293.5"/>
  </g>

  <text x="225" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000">Foundation first · broader layers with approval</text>
</svg>
